<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">

<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen selection:bg-red-600/30 selection:text-red-200">

  <!-- NAVBAR -->

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        
        <!-- Logo -->
        <div class="flex items-center gap-6">
          <a href="#" onclick="switchTab('popular')" class="flex items-center gap-2 group">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-red-600 via-rose-500 to-amber-500 flex items-center justify-center shadow-lg shadow-red-600/30 group-hover:scale-105 transition-transform">
              <i data-lucide="play" class="w-5 h-5 text-white fill-white ml-0.5"></i>
            </div>
            <span class="font-extrabold text-xl text-white tracking-wide">CINEMA<span class="text-red-500">HD</span></span>

          <nav class="hidden md:flex items-center space-x-1">
            <button onclick="switchTab('popular')" id="nav-popular" class="px-3.5 py-1.5 rounded-xl text-sm font-semibold bg-zinc-800 text-white shadow-sm">Популярное</button>
            <button onclick="switchTab('top250')" id="nav-top250" class="px-3.5 py-1.5 rounded-xl text-sm font-semibold text-zinc-400 hover:text-white">Топ 250</button>
            <button onclick="switchTab('series')" id="nav-series" class="px-3.5 py-1.5 rounded-xl text-sm font-semibold text-zinc-400 hover:text-white">Сериалы</button>
          </nav>
        </div>

        <!-- Live Search Bar -->
        <div class="flex-1 max-w-md relative">
          <div class="relative">
            <input
              type="text"
              id="search-input"
              placeholder="Поиск фильмов и сериалов..."
              oninput="handleSearchDebounce(this.value)"
              onfocus="if(this.value.trim()) document.getElementById('search-dropdown').classList.remove('hidden')"
              class="w-full bg-zinc-900 text-zinc-100 text-sm pl-10 pr-9 py-2.5 rounded-xl border border-zinc-800 focus:outline-none focus:border-red-500/80 focus:ring-2 focus:ring-red-500/20 transition-all placeholder:text-zinc-500"
            />
            <i data-lucide="search" class="w-4 h-4 text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
            <button id="search-clear-btn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>

          <!-- Dropdown search results -->
          <div id="search-dropdown" class="hidden absolute left-0 right-0 top-full mt-2 bg-zinc-900/95 backdrop-blur-xl border border-zinc-800 rounded-2xl shadow-2xl overflow-hidden z-50 max-h-96 overflow-y-auto divide-y divide-zinc-800/60">
          </div>

        <!-- Favorites Button -->
        <div class="flex items-center gap-2">

          </button>

      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-16">
    
    <!-- Hero Banner -->
    <div id="hero-banner" class="relative w-full h-[450px] sm:h-[500px] rounded-3xl overflow-hidden mb-10 shadow-2xl border border-zinc-800/80 group">
      <img id="hero-img" src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1600&auto=format&fit=crop" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" alt="Hero">
      <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/60 to-transparent"></div>

      <div class="absolute bottom-0 left-0 right-0 p-6 sm:p-10 max-w-3xl z-10 space-y-4">
        <div class="flex items-center gap-2">
          <span class="px-3 py-1 rounded-md bg-red-600 text-white text-xs font-bold uppercase tracking-wider flex items-center gap-1">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Vidsrc HD
          </span>
          <span id="hero-year" class="px-2.5 py-1 rounded-md bg-zinc-800 text-zinc-300 text-xs font-semibold">2014</span>
          <span id="hero-rating" class="px-2.5 py-1 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold">★ 8.6</span>
        </div>
        <h1 id="hero-title" class="text-3xl sm:text-5xl font-black text-white tracking-tight drop-shadow-md">Интерстеллар</h1>
        <p id="hero-desc" class="text-sm text-zinc-300 line-clamp-3 leading-relaxed">Когда засуха и пыльные бури приводят человечество к продовольственному кризису, коллектив исследователей отправляется сквозь червоточину в путешествие.</p>
        
        <div class="flex items-center gap-3 pt-2">
          <button id="hero-play-btn" onclick="openHeroMovie()" class="px-6 py-3 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white text-sm font-bold rounded-2xl shadow-xl shadow-red-600/40 flex items-center gap-2 transition-all transform hover:scale-105">
            <i data-lucide="play" class="w-5 h-5 fill-white"></i> Смотреть в Vidsrc HD
          </button>
        </div>
      </div>
    </div>

    <!-- Catalog Section Header & Filters -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-zinc-800 pb-4 mb-6">
      <div class="flex items-center gap-2">
        <i data-lucide="film" class="w-5 h-5 text-red-500"></i>
        <h2 id="section-title" class="text-2xl font-extrabold text-white">Каталог фильмов и сериалов</h2>
      </div>
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar" id="genre-filters">
        <button onclick="filterGenre('all')" class="genre-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-red-600 text-white" data-genre="all">Все жанры</button>
        <button onclick="filterGenre('Фантастика')" class="genre-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800" data-genre="Фантастика">Фантастика</button>
        <button onclick="filterGenre('Боевик')" class="genre-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800" data-genre="Боевик">Боевик</button>
        <button onclick="filterGenre('Драма')" class="genre-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800" data-genre="Драма">Драма</button>
        <button onclick="filterGenre('Комедия')" class="genre-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800" data-genre="Комедия">Комедия</button>
      </div>
    </div>

    <!-- Grid Container -->
    <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 sm:gap-6">
    </div>

  </main>

  <!-- VIDSRC HD PLAYER MODAL -->
  <div id="player-modal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-black/95 backdrop-blur-md flex items-center justify-center p-2 sm:p-4 lg:p-6">
    <!-- Backdrop click to close -->
    <div class="fixed inset-0" onclick="closePlayer()"></div>

    <div class="relative bg-zinc-950 border border-zinc-800/80 rounded-3xl w-full max-w-5xl overflow-hidden shadow-2xl z-10 flex flex-col my-auto max-h-[95vh]">
      
      <!-- Modal Header (Clean & Minimal) -->
      <div class="p-4 sm:p-5 flex items-center justify-between bg-zinc-900/80 border-b border-zinc-800">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-10 h-10 rounded-xl bg-red-600/20 text-red-500 flex items-center justify-center flex-shrink-0">
            <i data-lucide="play" class="w-5 h-5 fill-red-500 ml-0.5"></i>
          </div>
          <div class="min-w-0">
            <h3 id="modal-title" class="font-bold text-white text-lg truncate">Интерстеллар</h3>
            <div class="flex items-center gap-2 text-xs text-zinc-400">
              <span id="modal-year">2014</span>
              <span>•</span>
              <span class="text-emerald-400 font-semibold">Плеер Vidsrc HD</span>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button id="modal-fav-btn" onclick="toggleCurrentFavorite()" class="p-2.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-400 hover:text-red-400 transition-all">
            <i data-lucide="heart" class="w-4 h-4"></i>
          </button>
          <button onclick="closePlayer()" class="p-2.5 rounded-xl bg-zinc-900 hover:bg-red-950 border border-zinc-800 text-zinc-400 hover:text-red-400 transition-all">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Single Video Player Screen (Strictly Vidsrc HD with Full Popup & Ad Blocking) -->
      <div class="relative aspect-video w-full bg-black overflow-hidden flex items-center justify-center">
        <iframe 
          id="player-iframe" 
          src="" 
          class="w-full h-full border-0" 
          allowfullscreen 
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"
          referrerpolicy="no-referrer"
        ></iframe>
      </div>

      <!-- Description -->
      <div class="p-5 bg-zinc-950 border-t border-zinc-900">
        <p id="modal-description" class="text-xs text-zinc-300 leading-relaxed line-clamp-3">Описание загружается...</p>
      </div>

    </div>
  </div>

  <script>
    const API_KEY = '8c86825c-07a6-4f82-a4db-b09f10e35965';

    function fixPoster(url) {
      if (!url) return 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=600&auto=format&fit=crop';
      if (url.includes('unsplash.com')) return url;
      return `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=400&output=jpg`;
    }

    let catalogMovies = [];
    let currentTab = 'popular';
    let currentGenre = 'all';
    let currentMovie = null;
    let favorites = JSON.parse(localStorage.getItem('cinema_favs') || '[]');
    let searchDebounceTimer = null;

    // POPULAR CURATED MOVIES WITH VALID IMDB IDS (FOR 100% VIDSRC COMPATIBILITY)
    const BASE_MOVIES = [
      { id: 258687, imdbId: 'tt0816692', nameRu: 'Интерстеллар', year: 2014, rating: 8.6, poster: fixPoster('https://kinopoiskapiunofficial.tech/images/posters/kp/258687.jpg'), genre: 'Фантастика', type: 'films', description: 'Когда засуха и пыльные бури приводят человечество к продовольственному кризису, коллектив исследователей отправляется сквозь червоточину в путешествие.' },
      { id: 1143242, imdbId: 'tt11126994', nameRu: 'Аркейн', year: 2021, rating: 8.8, poster: fixPoster('https://kinopoiskapiunofficial.tech/images/posters/kp/1143242.jpg'), genre: 'Боевик', type: 'series', description: 'История разворачивается в утопическом Пилтовере и подземном Зауне и рассказывает о становлении двух сестер-чемпионов.' },
      { id: 4664634, imdbId: 'tt15398776', nameRu: 'Оппенгеймер', year: 2023, rating: 8.2, poster: fixPoster('https://kinopoiskapiunofficial.tech/images/posters/kp/4664634.jpg'), genre: 'Драма', type: 'films', description: 'История жизни американского физика Роберта Оппенгеймера, который стоял во главе первых разработок ядерного оружия.' },
      { id: 4444572, imdbId: 'tt15239678', nameRu: 'Дюна: Часть вторая', year: 2024, rating: 8.5, poster: fixPoster('https://kinopoiskapiunofficial.tech/images/posters/kp/4444572.jpg'), genre: 'Фантастика', type: 'films', description: 'Герцог Пол Атрейдес объединяется с Чани и фременами, чтобы отомстить заговорщикам, уничтожившим его семью.' },
      { id: 1227954, imdbId: 'tt13443470', nameRu: 'Уэнсдэй', year: 2022, rating: 8.0, poster: fixPoster('https://kinopoiskapiunofficial.tech/images/posters/kp/1227954.jpg'), genre: 'Фэнтези', type: 'series', description: 'Уэнсдэй Аддамс поступает в академию «Невермор», где пытается освоить свои экстрасенсорные способности и расследовать убийства.' },
      { id: 404900, imdbId: 'tt0903747', nameRu: 'Во все тяжкие', year: 2008, rating: 8.9, poster: fixPoster('https://kinopoiskapiunofficial.tech/images/posters/kp/404900.jpg'), genre: 'Драма', type: 'series', description: 'Учитель химии Уолтер Уайт узнает о смертельном диагнозе и начинает производить метамфетамин ради будущего семьи.' },
      { id: 464963, imdbId: 'tt0944947', nameRu: 'Игра престолов', year: 2011, rating: 9.0, poster: fixPoster('https://kinopoiskapiunofficial.tech/images/posters/kp/464963.jpg'), genre: 'Фэнтези', type: 'series', description: 'Несколько могущественных семейств Вестероса сражаются за Железный трон в канун наступления многолетней зимы.' },
      { id: 301, imdbId: 'tt0133093', nameRu: 'Матрица', year: 1999, rating: 8.5, poster: fixPoster('https://kinopoiskapiunofficial.tech/images/posters/kp/301.jpg'), genre: 'Фантастика', type: 'films', description: 'Программист Нео узнает страшную правду о том, что окружающая его реальность — это иллюзия.' },
      { id: 1236067, imdbId: 'tt9362722', nameRu: 'Человек-паук: Паутина вселенных', year: 2023, rating: 8.5, poster: fixPoster('https://kinopoiskapiunofficial.tech/images/posters/kp/1236067.jpg'), genre: 'Мультфильм', type: 'films', description: 'Майлз Моралес отправляется в путешествие по мультивселенной.' },
      { id: 685246, imdbId: 'tt2861424', nameRu: 'Рик и Морти', year: 2013, rating: 8.9, poster: fixPoster('https://kinopoiskapiunofficial.tech/images/posters/kp/685246.jpg'), genre: 'Комедия', type: 'series', description: 'Безумные межгалактические и межизмерительные приключения деда-ученого Рика и его внука Морти.' },
      { id: 361, imdbId: 'tt0137523', nameRu: 'Бойцовский клуб', year: 1999, rating: 8.6, poster: fixPoster('https://kinopoiskapiunofficial.tech/images/posters/kp/361.jpg'), genre: 'Драма', type: 'films', description: 'Сотрудник страховой компании встречает продавца мыла Тайлера Дёрдена.' },
      { id: 251733, imdbId: 'tt0499549', nameRu: 'Аватар', year: 2009, rating: 8.0, poster: fixPoster('https://kinopoiskapiunofficial.tech/images/posters/kp/251733.jpg'), genre: 'Фантастика', type: 'films', description: 'Бывший морпех Джейк Салли на планете Пандора оказывается в центре битвы за выживание.' }
    ];

    // FETCH MOVIES
    async function loadInitialCatalog(tab = 'popular') {
      const grid = document.getElementById('movie-grid');
      grid.innerHTML = `
        <div class="col-span-full py-20 text-center text-zinc-400 flex flex-col items-center justify-center gap-3">
          <div class="w-10 h-10 border-3 border-red-600 border-t-transparent rounded-full animate-spin"></div>
          <span class="text-sm font-semibold">Загрузка каталога Кинопоиска...</span>
        </div>
      `;

      let collectionType = 'TOP_POPULAR_ALL';
      if (tab === 'top250') collectionType = 'TOP_250_MOVIES';
      else if (tab === 'series') collectionType = 'POPULAR_SERIES';

      try {
        const res = await fetch(`https://kinopoiskapiunofficial.tech/api/v2.2/films/collections?type=${collectionType}&page=1`, {
          headers: { 'X-API-KEY': API_KEY }
        });
        if (res.ok) {
          const data = await res.json();
          if (data.items && data.items.length > 0) {
            catalogMovies = data.items.map(item => ({
              id: item.kinopoiskId || item.filmId,
              imdbId: item.imdbId,
              nameRu: item.nameRu || item.nameEn || 'Фильм',
              year: item.year || 2024,
              rating: item.ratingKinopoisk || item.ratingImdb || item.rating || 8.0,
              poster: fixPoster(item.posterUrlPreview || item.posterUrl),
              genre: item.genres && item.genres[0] ? item.genres[0].genre : 'Кино',
              type: item.type === 'TV_SERIES' || item.type === 'MINI_SERIES' || tab === 'series' ? 'series' : 'films',
              description: item.description || 'Смотреть онлайн бесплатно в высоком качестве.'
            }));
          }
        }
      } catch (err) {
        console.warn('API catalog fallback', err);
      }

      if (catalogMovies.length === 0) {
        catalogMovies = [...BASE_MOVIES];
      }

      currentMovie = catalogMovies[0];
      renderCatalog();
    }

    // RENDER CATALOG GRID
    function renderCatalog() {
      const grid = document.getElementById('movie-grid');
      let filtered = catalogMovies;

      if (currentTab === 'favorites') {
        filtered = catalogMovies.filter(m => favorites.includes(m.id));
      }

      if (currentGenre !== 'all') {
        filtered = filtered.filter(m => m.genre && m.genre.toLowerCase().includes(currentGenre.toLowerCase()));
      }

      grid.innerHTML = filtered.map(m => {
        const isFav = favorites.includes(m.id);
        return `
          <div onclick="openPlayerByMovieId(${m.id})" class="group bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800 hover:border-red-500/50 cursor-pointer transition-all duration-300 hover:-translate-y-1.5 shadow-lg flex flex-col justify-between">
            <div class="relative aspect-[2/3] w-full overflow-hidden bg-zinc-950">
              <img src="${m.poster}" alt="${m.nameRu}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 poster-img" loading="lazy">
              <div class="absolute top-3 left-3 bg-zinc-950/80 backdrop-blur-md px-2 py-1 rounded-lg border border-zinc-700/60 text-xs font-extrabold text-amber-400 shadow-md">
                ★ ${m.rating}
              </div>
              <button onclick="event.stopPropagation(); toggleFavorite(${m.id})" class="absolute bottom-3 right-3 p-2 rounded-xl backdrop-blur-md border ${isFav ? 'bg-red-950 border-red-700 text-red-400' : 'bg-zinc-950/80 hover:bg-zinc-800 border-zinc-700 text-zinc-300'}">
                <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'fill-red-500 text-red-500' : ''}"></i>
              </button>
            </div>
            <div class="p-3">
              <h3 class="font-bold text-white text-sm truncate group-hover:text-red-400 transition-colors">${m.nameRu}</h3>
              <p class="text-xs text-zinc-400 mt-0.5">${m.year} • ${m.genre}</p>
            </div>
          </div>
        `;
      }).join('');

      updateFavBadge();
      lucide.createIcons();
    }

    // SEARCH
    async function handleSearchDebounce(query) {
      clearTimeout(searchDebounceTimer);
      const clearBtn = document.getElementById('search-clear-btn');
      const dropdown = document.getElementById('search-dropdown');

      if (!query.trim()) {
        dropdown.classList.add('hidden');
        clearBtn.classList.add('hidden');
        return;
      }
      clearBtn.classList.remove('hidden');

      dropdown.innerHTML = `
        <div class="p-4 text-center text-xs text-zinc-400 flex items-center justify-center gap-2">
          <div class="w-4 h-4 border-2 border-red-500 border-t-transparent rounded-full animate-spin"></div>
          Поиск по Кинопоиску...
        </div>
      `;
      dropdown.classList.remove('hidden');

      searchDebounceTimer = setTimeout(async () => {
        let results = [];
        try {
          const res = await fetch(`https://kinopoiskapiunofficial.tech/api/v2.1/films/search-by-keyword?keyword=${encodeURIComponent(query)}`, {
            headers: { 'X-API-KEY': API_KEY }
          });
          if (res.ok) {
            const data = await res.json();
            if (data.films && data.films.length > 0) {
              results = data.films.slice(0, 10).map(f => ({
                id: f.filmId || f.kinopoiskId,
                imdbId: f.imdbId,
                nameRu: f.nameRu || f.nameEn || 'Фильм',
                year: f.year || '2024',
                rating: f.rating || '7.5',
                poster: fixPoster(f.posterUrlPreview || f.posterUrl),
                type: f.type === 'TV_SERIES' || f.type === 'MINI_SERIES' ? 'series' : 'films',
                description: f.description || 'Смотреть онлайн бесплатно.'
              }));
            }
          }
        } catch (e) {
          console.warn('Network search fallback', e);
        }

        if (results.length === 0) {
          const q = query.toLowerCase();
          results = catalogMovies.filter(m => m.nameRu.toLowerCase().includes(q));
        }

        if (results.length > 0) {
          dropdown.innerHTML = results.map(m => `
            <div onclick="openPlayerFromSearch(${m.id}, '${m.nameRu.replace(/'/g, "\\'")}', '${m.year}', '${m.rating}', '${m.poster}', '${m.imdbId || ''}', '${m.type}')" class="p-3 hover:bg-zinc-800 cursor-pointer flex items-center gap-3 transition-colors">
              <img src="${m.poster}" class="w-9 h-13 object-cover rounded bg-zinc-950 flex-shrink-0 poster-img">
              <div class="min-w-0 flex-1">
                <div class="font-bold text-sm text-white truncate">${m.nameRu}</div>
                <div class="text-xs text-zinc-400 mt-0.5 font-mono">${m.year} • <span class="text-emerald-400 font-bold">★ ${m.rating}</span></div>
              </div>
            </div>
          `).join('');
        } else {
          dropdown.innerHTML = `
            <div class="p-4 text-center text-xs text-zinc-400">
              По запросу «${query}» ничего не найдено.
            </div>
          `;
        }
      }, 300);
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      document.getElementById('search-dropdown').classList.add('hidden');
      document.getElementById('search-clear-btn').classList.add('hidden');
    }

    function openPlayerFromSearch(id, nameRu, year, rating, poster, imdbId, type) {
      document.getElementById('search-dropdown').classList.add('hidden');
      openPlayer({ id, imdbId, nameRu, year, rating, poster, type, description: 'Смотреть онлайн в высоком качестве HD.' });
    }

    function openPlayerByMovieId(id) {
      const m = catalogMovies.find(item => item.id === id) || BASE_MOVIES.find(item => item.id === id) || { id, nameRu: `Фильм #${id}`, year: 2024 };
      openPlayer(m);
    }

    function openHeroMovie() {
      if (currentMovie) openPlayer(currentMovie);
      else if (catalogMovies.length > 0) openPlayer(catalogMovies[0]);
    }

    // VIDSRC HD EMBED BUILDER
    function openPlayer(movie) {
      currentMovie = movie;

      document.getElementById('modal-title').innerText = movie.nameRu;
      document.getElementById('modal-year').innerText = movie.year || '2024';
      document.getElementById('modal-description').innerText = movie.description || 'Смотреть онлайн в плеере Vidsrc HD.';

      const iframe = document.getElementById('player-iframe');
      const isSeries = movie.type === 'series';
      const targetId = movie.imdbId || movie.id;

      // Pure Vidsrc HD stream URL
      if (isSeries) {
        iframe.src = `https://vidsrc.to/embed/tv/${targetId}`;
      } else {
        iframe.src = `https://vidsrc.to/embed/movie/${targetId}`;
      }

      document.getElementById('player-modal').classList.remove('hidden');
    }

    function closePlayer() {
      document.getElementById('player-modal').classList.add('hidden');
      document.getElementById('player-iframe').src = '';
    }

    // FAVORITES
    function toggleFavorite(id) {
      if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem('cinema_favs', JSON.stringify(favorites));
      renderCatalog();
    }

    function toggleCurrentFavorite() {
      if (currentMovie) toggleFavorite(currentMovie.id);
    }

    function updateFavBadge() {
      const badge = document.getElementById('fav-count-badge');
      if (favorites.length > 0) {
        badge.innerText = favorites.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      currentGenre = 'all';
      
      ['popular', 'top250', 'series', 'favorites'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (btn) btn.className = t === tab ? 'px-3.5 py-1.5 rounded-xl text-sm font-semibold bg-zinc-800 text-white shadow-sm' : 'px-3.5 py-1.5 rounded-xl text-sm font-semibold text-zinc-400 hover:text-white';
      });

      if (tab === 'popular' || tab === 'top250' || tab === 'series') {
        loadInitialCatalog(tab);
      } else {
        renderCatalog();
      }
    }

    function filterGenre(genre) {
      currentGenre = genre;
      document.querySelectorAll('.genre-btn').forEach(btn => {
        const isCurrent = btn.getAttribute('data-genre') === genre;
        btn.className = isCurrent ? 'genre-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-red-600 text-white' : 'genre-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800';
      });
      renderCatalog();
    }

    // INIT ON LOAD
    loadInitialCatalog('popular');
    lucide.createIcons();
  </script>
</body>
</html>
