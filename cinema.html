<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CINEMAHD — Онлайн Кинотеатр</title>
  <meta name="description" content="Смотреть фильмы и сериалы онлайн бесплатно в высоком качестве без рекламы.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#09090b;--bg2:#111113;--bg3:#18181b;--brd:#27272a;--txt:#fafafa;--txt2:#a1a1aa;--txt3:#71717a;--red:#e11d48;--red2:#be123c;--amber:#f59e0b;--green:#10b981}
    html,body{background:var(--bg);color:var(--txt);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none} button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
    ::-webkit-scrollbar{width:5px;height:5px} ::-webkit-scrollbar-track{background:var(--bg)} ::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}
    .navbar{position:sticky;top:0;z-index:100;background:rgba(9,9,11,.93);backdrop-filter:blur(20px);border-bottom:1px solid var(--brd)}
    .nb{max-width:1400px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:16px}
    .logo{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer}
    .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#e11d48,#f43f5e,#fb923c);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 0 20px rgba(225,29,72,.4)}
    .logo-text{font-weight:900;font-size:19px;letter-spacing:-.5px} .logo-text span{color:var(--red)}
    .nav-tabs{display:flex;gap:4px;flex-shrink:0}
    @media(max-width:600px){.nav-tabs{display:none}}
    .nav-tab{padding:7px 15px;border-radius:10px;font-size:13px;font-weight:600;color:var(--txt3);transition:all .2s}
    .nav-tab:hover{color:var(--txt);background:var(--bg3)} .nav-tab.active{background:var(--bg3);color:var(--txt);border:1px solid var(--brd)}
    .sw{flex:1;max-width:440px;position:relative}
    .si{width:100%;background:var(--bg3);border:1px solid var(--brd);border-radius:12px;padding:9px 34px 9px 36px;font-size:14px;color:var(--txt);outline:none;transition:border-color .2s,box-shadow .2s}
    .si:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(225,29,72,.15)} .si::placeholder{color:var(--txt3)}
    .sico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:14px;pointer-events:none}
    .sclr{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--txt3);display:none;font-size:12px;padding:2px 4px;border-radius:4px}
    .sclr:hover{color:var(--txt);background:var(--bg3)}
    .sdrop{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--bg2);border:1px solid var(--brd);border-radius:16px;box-shadow:0 25px 60px rgba(0,0,0,.7);overflow:hidden;display:none;max-height:380px;overflow-y:auto;z-index:999}
    .sitem{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;transition:background .15s;border-bottom:1px solid rgba(39,39,42,.5)}
    .sitem:last-child{border-bottom:none} .sitem:hover{background:var(--bg3)}
    .sitem img{width:38px;height:54px;object-fit:cover;border-radius:6px;background:var(--bg3);flex-shrink:0}
    .sitem-n{font-weight:700;font-size:13px;color:var(--txt)} .sitem-s{font-size:11px;color:var(--txt2);margin-top:2px}
    .fb{padding:9px 11px;border-radius:10px;background:var(--bg3);border:1px solid var(--brd);color:var(--txt3);transition:all .2s;position:relative;flex-shrink:0;font-size:16px}
    .fb:hover{color:var(--txt);border-color:var(--red)}
    .fbadge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:9px;font-weight:800;width:17px;height:17px;border-radius:50%;display:none;align-items:center;justify-content:center}
    .main{max-width:1400px;margin:0 auto;padding:24px 20px 80px}
    .hero{position:relative;width:100%;height:460px;border-radius:22px;overflow:hidden;margin-bottom:36px;border:1px solid var(--brd)}
    @media(max-width:700px){.hero{height:320px;border-radius:14px}}
    .hero-img{width:100%;height:100%;object-fit:cover;transition:transform 8s ease}
    .hero:hover .hero-img{transform:scale(1.04)}
    .ho1{position:absolute;inset:0;background:linear-gradient(to top,rgba(9,9,11,1) 0%,rgba(9,9,11,.7) 40%,rgba(9,9,11,.1) 100%)}
    .ho2{position:absolute;inset:0;background:linear-gradient(to right,rgba(9,9,11,.9) 0%,rgba(9,9,11,.4) 60%,transparent 100%)}
    .hc{position:absolute;bottom:0;left:0;right:0;padding:28px 36px;z-index:10}
    @media(max-width:700px){.hc{padding:18px 18px}}
    .hbadges{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
    .badge{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.4px}
    .b-red{background:var(--red);color:#fff} .b-dark{background:var(--bg3);color:var(--txt2);border:1px solid var(--brd)} .b-green{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3)}
    .htitle{font-size:clamp(22px,5vw,44px);font-weight:900;line-height:1.1;letter-spacing:-1px;color:#fff;margin-bottom:8px;text-shadow:0 2px 20px rgba(0,0,0,.5)}
    .hdesc{font-size:14px;color:rgba(250,250,250,.75);max-width:540px;line-height:1.6;margin-bottom:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .hbtn{display:inline-flex;align-items:center;gap:10px;padding:12px 26px;background:var(--red);color:#fff;font-size:14px;font-weight:700;border-radius:13px;transition:all .25s;box-shadow:0 8px 28px rgba(225,29,72,.4)}
    .hbtn:hover{background:var(--red2);transform:translateY(-2px);box-shadow:0 12px 36px rgba(225,29,72,.5)}
    .sec-hdr{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--brd);padding-bottom:14px;margin-bottom:22px}
    .sec-lft{display:flex;align-items:center;gap:8px}
    .sec-dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0}
    .sec-ttl{font-size:21px;font-weight:800;letter-spacing:-.4px}
    .gf{display:flex;gap:6px;overflow-x:auto} .gf::-webkit-scrollbar{display:none}
    .gbtn{padding:5px 13px;border-radius:8px;font-size:12px;font-weight:600;color:var(--txt3);border:1px solid var(--brd);background:var(--bg3);transition:all .2s;white-space:nowrap;flex-shrink:0}
    .gbtn:hover{color:var(--txt);border-color:rgba(225,29,72,.5)} .gbtn.active{background:var(--red);color:#fff;border-color:var(--red)}
    .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:18px}
    @media(max-width:500px){.mgrid{grid-template-columns:repeat(2,1fr);gap:10px}}
    .mc{background:var(--bg2);border:1px solid var(--brd);border-radius:15px;overflow:hidden;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .3s}
    .mc:hover{transform:translateY(-6px);border-color:rgba(225,29,72,.5);box-shadow:0 18px 40px rgba(0,0,0,.5)}
    .cp{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--bg3)}
    .cp img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
    .mc:hover .cp img{transform:scale(1.08)}
    .crat{position:absolute;top:8px;left:8px;background:rgba(9,9,11,.85);backdrop-filter:blur(8px);border:1px solid rgba(245,158,11,.3);padding:3px 7px;border-radius:6px;font-size:11px;font-weight:800;color:var(--amber)}
    .ctype{position:absolute;top:8px;right:8px;background:rgba(9,9,11,.85);backdrop-filter:blur(8px);border:1px solid var(--brd);padding:2px 6px;border-radius:5px;font-size:9px;font-weight:800;color:var(--txt2);letter-spacing:.4px}
    .cfav{position:absolute;bottom:8px;right:8px;width:30px;height:30px;border-radius:8px;background:rgba(9,9,11,.85);backdrop-filter:blur(8px);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;color:var(--txt3);font-size:13px;transition:all .2s;z-index:2}
    .cfav:hover,.cfav.active{color:var(--red);border-color:var(--red);background:rgba(225,29,72,.2)}
    .ci{padding:11px} .ctitle{font-weight:700;font-size:13px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;transition:color .2s}
    .mc:hover .ctitle{color:var(--red)} .csub{font-size:11px;color:var(--txt3)}
    .ld{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:80px 0;color:var(--txt2);font-size:14px}
    .sp{width:34px;height:34px;border:3px solid var(--brd);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .es{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--txt3)}
    .es-ico{font-size:46px;margin-bottom:14px;opacity:.35} .es-ttl{font-size:17px;font-weight:700;color:var(--txt2);margin-bottom:6px} .es-sub{font-size:13px}
    .mo{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.97);backdrop-filter:blur(24px);display:none;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
    .mo.open{display:flex}
    .mob{position:fixed;inset:0;z-index:0}
    .mbox{position:relative;width:100%;max-width:980px;background:var(--bg2);border:1px solid var(--brd);border-radius:22px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.8);z-index:1;display:flex;flex-direction:column;max-height:calc(100vh - 28px)}
    .mhdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(24,24,27,.8);border-bottom:1px solid var(--brd);flex-shrink:0;gap:12px}
    .mhdr-l{display:flex;align-items:center;gap:11px;min-width:0}
    .mico{width:36px;height:36px;flex-shrink:0;background:rgba(225,29,72,.15);border:1px solid rgba(225,29,72,.3);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--red);font-size:15px}
    .mttl{font-weight:800;font-size:15px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mmeta{font-size:11px;color:var(--txt3);margin-top:2px;display:flex;align-items:center;gap:5px}
    .mmeta-g{color:var(--green);font-weight:700}
    .macts{display:flex;align-items:center;gap:7px;flex-shrink:0}
    .mbtn{width:34px;height:34px;border-radius:9px;background:var(--bg3);border:1px solid var(--brd);color:var(--txt3);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s}
    .mbtn:hover{color:var(--txt);border-color:rgba(225,29,72,.5)}
    .mbtn.fa{color:var(--red);border-color:var(--red);background:rgba(225,29,72,.1)}
    .mbtn.cl:hover{border-color:var(--red);background:rgba(225,29,72,.1);color:var(--red)}
    .pa{position:relative;aspect-ratio:16/9;background:#000;flex-shrink:0;overflow:hidden}
    .pa:fullscreen, .pa:-webkit-full-screen, .pa:-moz-full-screen{width:100vw!important;height:100vh!important;max-width:100vw!important;max-height:100vh!important;aspect-ratio:auto!important;border-radius:0!important;background:#000!important}
    .pa:fullscreen #player-iframe, .pa:-webkit-full-screen #player-iframe{width:100vw!important;height:100vh!important;border-radius:0!important}
    /* GUARD: shown before user clicks — prevents auto-ad-redirect */
    .guard{position:absolute;inset:0;z-index:5;background:linear-gradient(135deg,rgba(9,9,11,.96),rgba(9,9,11,.92));display:flex;align-items:center;justify-content:center;cursor:pointer}
    .guard-inner{display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff;text-align:center;padding:20px}
    .guard-icon{width:68px;height:68px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 0 40px rgba(225,29,72,.55);animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 40px rgba(225,29,72,.55)}50%{box-shadow:0 0 65px rgba(225,29,72,.8)}}
    .guard-title{font-size:16px;font-weight:800} .guard-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:-6px}
    #player-iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
    .srv-bar{display:flex;align-items:center;gap:6px;padding:9px 18px;background:var(--bg3);border-bottom:1px solid var(--brd);overflow-x:auto;flex-shrink:0}
    .srv-lbl{font-size:12px;font-weight:700;color:var(--txt2);flex-shrink:0;margin-right:4px}
    .srv-btn{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;background:var(--bg2);border:1px solid var(--brd);color:var(--txt2);white-space:nowrap;transition:all .2s;cursor:pointer}
    .srv-btn:hover{color:var(--txt);border-color:var(--red)}
    .srv-btn.active{background:var(--red);border-color:var(--red);color:#fff}
    .sc{padding:14px 18px;background:var(--bg2);border-top:1px solid var(--brd);display:none;gap:10px;flex-wrap:wrap;align-items:center;flex-shrink:0}
    .sc.vis{display:flex} .slbl{font-size:12px;font-weight:700;color:var(--txt2);flex-shrink:0}
    .ssel{background:var(--bg3);border:1px solid var(--brd);border-radius:8px;padding:5px 11px;font-size:13px;color:var(--txt);outline:none;cursor:pointer;transition:border-color .2s}
    .ssel:focus{border-color:var(--red)}
    .epbtn{padding:5px 12px;border-radius:7px;background:var(--bg3);border:1px solid var(--brd);font-size:12px;font-weight:600;color:var(--txt2);transition:all .2s}
    .epbtn:hover{border-color:var(--red);color:var(--txt)} .epbtn.active{background:var(--red);border-color:var(--red);color:#fff}
    .mdesc{padding:14px 18px;border-top:1px solid var(--brd);font-size:13px;color:var(--txt2);line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex-shrink:0}
    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--bg3);border:1px solid var(--brd);border-radius:11px;padding:11px 18px;font-size:13px;font-weight:600;color:var(--txt);z-index:9999;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;pointer-events:none;white-space:nowrap;box-shadow:0 18px 50px rgba(0,0,0,.5)}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nb">
      <div class="logo" onclick="switchTab('popular')">
        <div class="logo-icon">▶</div>
        <div class="logo-text">CINEMA<span>HD</span></div>
      </div>
      <div class="nav-tabs">
        <button class="nav-tab active" id="tab-popular" onclick="switchTab('popular')">Популярное</button>
        <button class="nav-tab" id="tab-top250" onclick="switchTab('top250')">Топ 250</button>
        <button class="nav-tab" id="tab-series" onclick="switchTab('series')">Сериалы</button>
      </div>
      <div class="sw">
        <span class="sico">🔍</span>
        <input type="text" id="search-input" class="si" placeholder="Поиск фильмов и сериалов..." oninput="handleSearch(this.value)" autocomplete="off" spellcheck="false">
        <button class="sclr" id="search-clear" onclick="clearSearch()">✕</button>
        <div class="sdrop" id="search-dropdown"></div>
      </div>
      <button class="fb" id="tab-favorites" onclick="switchTab('favorites')" title="Избранное">♥<span class="fbadge" id="fav-badge"></span></button>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main">
    <!-- HERO -->
    <div class="hero">
      <img id="hero-img" src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1600&auto=format&fit=crop" class="hero-img" alt="">
      <div class="ho1"></div>
      <div class="ho2"></div>
      <div class="hc">
        <div class="hbadges">
          <span class="badge b-red">▶ HD</span>
          <span class="badge b-dark" id="hero-year">2024</span>
          <span class="badge b-green" id="hero-rating">★ 8.0</span>
        </div>
        <h1 class="htitle" id="hero-title">Добро пожаловать</h1>
        <p class="hdesc" id="hero-desc">Смотрите лучшие фильмы и сериалы онлайн в высоком качестве.</p>
        <button class="hbtn" onclick="openHeroMovie()">▶ &nbsp;Смотреть</button>
      </div>
    </div>

    <!-- SECTION HEADER -->
    <div class="sec-hdr">
      <div class="sec-lft">
        <div class="sec-dot"></div>
        <h2 class="sec-ttl" id="section-title">Каталог</h2>
      </div>
      <div class="gf" id="genre-filters">
        <button class="gbtn active" data-genre="all" onclick="setGenre('all')">Все</button>
        <button class="gbtn" data-genre="Фантастика" onclick="setGenre('Фантастика')">Фантастика</button>
        <button class="gbtn" data-genre="Боевик" onclick="setGenre('Боевик')">Боевик</button>
        <button class="gbtn" data-genre="Драма" onclick="setGenre('Драма')">Драма</button>
        <button class="gbtn" data-genre="Комедия" onclick="setGenre('Комедия')">Комедия</button>
        <button class="gbtn" data-genre="Триллер" onclick="setGenre('Триллер')">Триллер</button>
        <button class="gbtn" data-genre="Мультфильм" onclick="setGenre('Мультфильм')">Мультфильм</button>
      </div>
    </div>

    <!-- GRID -->
    <div class="mgrid" id="movie-grid">
      <div class="ld"><div class="sp"></div>Загрузка каталога...</div>
    </div>
  </main>

  <!-- PLAYER MODAL -->
  <div class="mo" id="player-modal">
    <div class="mob" onclick="closePlayer()"></div>
    <div class="mbox">
      <div class="mhdr">
        <div class="mhdr-l">
          <div class="mico">▶</div>
          <div style="min-width:0">
            <div class="mttl" id="modal-title">Загрузка...</div>
            <div class="mmeta"><span id="modal-year">2024</span><span>•</span><span class="mmeta-g">✓ Защита от рекламы</span></div>
          </div>
        </div>
        <div class="macts">
          <button class="mbtn" id="modal-fs-btn" onclick="toggleFullscreen()" title="Во весь экран (F)">⛶</button>
          <button class="mbtn" id="modal-fav-btn" onclick="toggleCurrentFavorite()" title="Избранное">♥</button>
          <button class="mbtn cl" onclick="closePlayer()" title="Закрыть (Esc)">✕</button>
        </div>
      </div>

      <!-- SERVER SELECTOR -->
      <div class="srv-bar" id="server-bar">
        <span class="srv-lbl">Сервер:</span>
        <button class="srv-btn active" onclick="setProvider(0)">⚡ Сервер 1 (Full HD + Виджеты)</button>
        <button class="srv-btn" onclick="setProvider(1)">🎬 Сервер 2 (Vidsrc CC)</button>
        <button class="srv-btn" onclick="setProvider(2)">🌐 Сервер 3 (Vidsrc XYZ)</button>
        <button class="srv-btn" onclick="setProvider(3)">⚡ Сервер 4 (AutoEmbed)</button>
      </div>

      <!-- PLAYER AREA -->
      <div class="pa" id="player-area">
        <!-- Guard: user must click once before iframe loads — prevents instant ad redirect -->
        <div class="guard" id="player-guard" onclick="activatePlayer()">
          <div class="guard-inner">
            <div class="guard-icon">▶</div>
            <div class="guard-title" id="guard-title">Нажмите для просмотра</div>
            <div class="guard-sub">Один клик для запуска плеера</div>
          </div>
        </div>
        <iframe id="player-iframe" src="about:blank"
          allowfullscreen="true"
          webkitallowfullscreen="true"
          mozallowfullscreen="true"
          allow="autoplay; fullscreen; picture-in-picture; encrypted-media; accelerometer; gyroscope"
          referrerpolicy="origin"
          title="Video Player"></iframe>
      </div>

      <!-- Series controls -->
      <div class="sc" id="series-controls">
        <span class="slbl">Сезон:</span>
        <select class="ssel" id="season-select" onchange="onSeasonChange()"></select>
        <span class="slbl">Эпизод:</span>
        <div id="ep-list" style="display:flex;gap:5px;flex-wrap:wrap;"></div>
      </div>

      <div class="mdesc" id="modal-desc">Описание загружается...</div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    // ANTI-AD PROTECTION: neutralize popup windows and top-frame redirects
    (function () {
      try {
        window.open = function (url) {

    function toggleFullscreen() {
      const pa = document.getElementById('player-area');
      const isFs = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement;
      if (!isFs) {
        if (pa.requestFullscreen) pa.requestFullscreen().catch(() => {});
        else if (pa.webkitRequestFullscreen) pa.webkitRequestFullscreen();
        else if (pa.mozRequestFullScreen) pa.mozRequestFullScreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
      }
    }

    document.addEventListener('fullscreenchange', updateFsButton);
    document.addEventListener('webkitfullscreenchange', updateFsButton);
    document.addEventListener('mozfullscreenchange', updateFsButton);

    function updateFsButton() {
      const btn = document.getElementById('modal-fs-btn');
      if (!btn) return;
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
      btn.textContent = isFs ? '✕' : '⛶';
      btn.title = isFs ? 'Выйти из полноэкранного режима (Esc / F)' : 'Во весь экран (F)';
    }

    document.addEventListener('keydown', e => {
      const modal = document.getElementById('player-modal');
      const isModalOpen = modal && modal.classList.contains('open');
      if (e.key === 'Escape' && isModalOpen) {
        if (document.fullscreenElement) {
          try { document.exitFullscreen(); } catch (err) {}
        } else {
          closePlayer();
        }
      } else if ((e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') && isModalOpen && document.activeElement.tagName !== 'INPUT') {
        toggleFullscreen();
      }
    });

    function closePlayer() {
      if (document.fullscreenElement) {
        try { document.exitFullscreen(); } catch (e) {}

      document.getElementById('player-modal').classList.remove('open');
      document.body.style.overflow = '';

      const favTab = document.getElementById('tab-favorites');
      if (favTab) favTab.classList.toggle('active', tab === 'favorites');

      document.querySelectorAll('.gbtn').forEach(b => b.classList.toggle('active', b.getAttribute('data-genre') === 'all'));

      const secTitle = document.getElementById('section-title');
      if (tab === 'popular') secTitle.textContent = 'Популярное сейчас';
      else if (tab === 'top250') secTitle.textContent = 'Топ 250 фильмов';
      else if (tab === 'series') secTitle.textContent = 'Популярные сериалы';
      else if (tab === 'favorites') secTitle.textContent = 'Моё избранное';

      if (tab === 'popular' || tab === 'top250' || tab === 'series') {
        loadCatalog(tab);
      } else {
        renderGrid();
      }
    }

    function setGenre(genre) {
      currentGenre = genre;
      document.querySelectorAll('.gbtn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-genre') === genre);
      });
      renderGrid();
    }

    // TOAST NOTIFICATION
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        t.classList.remove('show');
      }, 2400);
    }

    // INIT
    loadCatalog('popular');
  </script>
</body>
</html>
